name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Prepare Out Directory
        run: |
          mkdir -p out
          if [ -f "index.html" ]; then cp index.html out/index.html; fi
          if [ -d "public" ]; then cp -r public/* out/ 2>/dev/null || true; fi

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_COCREATOR_SAAS }}'
          projectId: cocreator-saas
          target: cocreator-ml00
          channelId: live
